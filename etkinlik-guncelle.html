<!DOCTYPE html>
<html lang="tr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Etkinlik Güncelle - Kampüs Etkinlikleri</title>
    <!-- CSS Dosyan -->
    <link rel="stylesheet" href="2416501035.css">
</head>

<body>

    <!-- HEADER / NAVBAR (Diğer sayfalarla birebir aynı yapı) -->
    <header class="navbar">
        <h1>Kampüs Etkinlikleri</h1>
        <nav>
            <a href="index.html">Ana Sayfa</a>
            <a href="etkinlikler.html">Etkinlikler</a>
            <a href="etkinlik-detay.html">Etkinlik Detay</a>
            <a href="etkinlik-ekle.html">Ekle</a>
            <a href="etkinlik-guncelle.html" class="active">Güncelle</a>
        </nav>
    </header>

    <!-- MAIN FORM ALANI -->
    <main class="container" style="max-width: 600px;">

        <h2>Etkinlik Güncelle</h2>

        <form>

            <div class="form-group">
                <label for="etkinlikAdi">Etkinlik adı</label>
                <input type="text" id="etkinlikAdi" name="etkinlikAdi" value="Kariyer Günleri" required>
            </div>

            <div class="form-group">
                <label for="kategori">Kategori</label>
                <select id="kategori" name="kategori" required>
                    <option value="Seminer" selected>Seminer</option>
                    <option value="Atolye">Atölye</option>
                    <option value="Konferans">Konferans</option>
                    <option value="Söyleşi">Söyleşi</option>
                </select>
            </div>

            <div class="form-group">
                <label for="tarih">Tarih</label>
                <input type="text" id="tarih" name="tarih" value="12.10.2026" required>
            </div>

            <div class="form-group">
                <label for="aciklama">Açıklama</label>
                <textarea id="aciklama" name="aciklama" rows="5" required>Mezun söyleşisi</textarea>
            </div>

            <button type="submit" class="btn-submit">Güncelle</button>

        </form>

    </main>

    <!-- FOOTER -->
    <footer>
        <p>Ad Soyad: Yagmur Lök | Okul No: 2416501035 | 2026</p>
    </footer>

</body>

</html>
