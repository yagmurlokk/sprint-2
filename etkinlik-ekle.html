<!DOCTYPE html>
<html lang="tr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Etkinlik Ekle - Kampüs Etkinlikleri</title>
    <!-- Ortak CSS Bağlantısı -->
    <link rel="stylesheet" href="2416501035.css">
</head>

<body>

    <!-- HEADER / NAVBAR -->
    <header class="navbar">
        <h1>Kampüs Etkinlikleri</h1>
        <nav>
            <a href="index.html">Ana Sayfa</a>
            <a href="etkinlikler.html">Etkinlikler</a>
            <a href="etkinlik-detay.html">Etkinlik Detay</a>
            <a href="etkinlik-ekle.html" class="active">Ekle</a>
            <a href="etkinlik-guncelle.html">Güncelle</a>
        </nav>
    </header>

    <!-- MAIN FORM ALANI -->
    <main class="container" style="max-width: 600px;">

        <h2>Etkinlik Ekle</h2>

        <form>

            <div class="form-group">
                <label for="etkinlikAdi">Etkinlik adı</label>
                <input type="text" id="etkinlikAdi" name="etkinlikAdi" required>
            </div>

            <div class="form-group">
                <label for="kategori">Kategori</label>
                <select id="kategori" name="kategori" required>
                    <option value="" disabled selected>Seçiniz</option>
                    <option value="Seminer">Seminer</option>
                    <option value="Atolye">Atölye</option>
                    <option value="Konferans">Konferans</option>
                    <option value="Sosyal">Sosyal Etkinlik</option>
                </select>
            </div>

            <div class="form-group">
                <label for="tarih">Tarih</label>
                <!-- Taslaktaki 'boş bırakıldı' uyarısına uygun required tanımı -->
                <input type="date" id="tarih" name="tarih" required>
            </div>

            <div class="form-group">
                <label for="aciklama">Açıklama</label>
                <textarea id="aciklama" name="aciklama" rows="5" required></textarea>
            </div>

            <button type="submit" class="btn-submit">Kaydet</button>

        </form>

    </main>

    <!-- FOOTER -->
    <footer>
        <p>Ad Soyad: Yağmur Lök | Okul No: 2416501035 | 2026</p>
    </footer>

</body>

</html>
